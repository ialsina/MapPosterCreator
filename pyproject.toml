[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "map_poster_creator"
dynamic = ["version"]
description = "Map Poster Creator"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Ivan Alsina-Ferrer", email = "opensource@ivalsfer.com"},
]
dependencies = [
    "numpy>=2.0,<3.0",
    "scipy>=1.13,<1.14",
    "pandas>=2.2,<2.3",
    "matplotlib>=3.9,<3.10",
    "shapely>=2.0,<2.1",
    "geopandas>=0.14.4",
    "ete3==3.1.3",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "beautifulsoup4",
    "colour",
    "descartes",
    "pyyaml",
    "requests",
    "tabulate",
    "tqdm",
    "unidecode",
    "wget",
]
keywords = ["map", "poster", "osm", "geopandas"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
]
[project.urls]
Homepage = "https://github.com/k4m454k/MapPosterCreator"

[project.scripts]
mapoc = "map_poster_creator.entrypoints:map_poster"

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-mock",
    "httpx2",
    "ruff>=0.9",
]

[tool.setuptools.dynamic]
version = {attr = "map_poster_creator.__version__"}

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "scripts"]

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "UP",
    "W",
]

[tool.ruff.lint.per-file-ignores]
"docs/conf.py" = ["E402"]
"scripts/*" = ["E501", "B904"]
